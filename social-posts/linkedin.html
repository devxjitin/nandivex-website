<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NandiVex LinkedIn</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root { --accent: #7A3CE0; --accent-dark: #5A24B0; --orange: #F47B2E; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: var(--accent-dark); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .part { display: none; position: relative; overflow: hidden; background: var(--accent-dark); }
  .part.on { display: block; }

  /* Profile logo, 400 x 400 */
  .logo { width: 400px; height: 400px; background: var(--accent); }
  .logo img { position: absolute; left: 50%; top: 50%; width: 236px; transform: translate(-50%, -50%); }

  /* Cover banner, 1128 x 191 */
  .banner { width: 1128px; height: 191px; }
  .banner::before { content: ''; position: absolute; width: 520px; height: 520px; right: -130px; top: -260px; border-radius: 50%; background: var(--accent); }
  .banner .mark { position: absolute; right: 40px; top: 18px; width: 190px; opacity: .18; }
  .banner .txt { position: absolute; left: 300px; top: 44px; right: 260px; color: #fff; }
  .banner h1 { font-family: "Plus Jakarta Sans"; font-weight: 800; font-size: 34px; line-height: 1.12; letter-spacing: -.02em; }
  .banner p { margin-top: 12px; font-size: 15px; font-weight: 500; color: #E4D4FF; }
  .banner p i { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: #B99BEF; margin: 0 9px; vertical-align: 3px; }
  .banner .url { position: absolute; right: 44px; bottom: 26px; color: #fff; font-size: 15px; font-weight: 600; }
  .banner .url b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); margin-right: 8px; }
</style>
</head>
<body>
<section class="part logo" id="logo"><img src="../public/brand/icon-white.png" alt="NandiVex Technologies"></section>

<section class="part banner" id="banner">
  <img class="mark" src="../public/brand/icon-white.png" alt="">
  <div class="txt">
    <h1>Software, Apps &amp; Automation<br>for Growing Businesses</h1>
    <p>AI Agents<i></i>Web<i></i>Android<i></i>Desktop<i></i>Cyber Security</p>
  </div>
  <div class="url"><b></b>nandivex.in</div>
</section>
<script>
  document.getElementById(new URLSearchParams(location.search).get('part') || 'logo').classList.add('on');
</script>
</body>
</html>
