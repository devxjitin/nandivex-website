# Run the website locally on Docker.
#
#   docker compose up              dev server with hot reload   http://localhost:5173
#   docker compose --profile prod up --build web
#                                  production build behind nginx http://localhost:8081
#                                  (what GitHub Pages will serve: prerendered pages, 404.html)
#   docker compose down            stop
#
# `dev` mounts this folder, so editing files here (content in src/data, pages, styles) updates the
# browser at once. Run the `web` service before deploying to check the real build works.
services:
  dev:
    image: node:22-alpine
    container_name: nandivex-website-dev
    working_dir: /app
    environment:
      # File change events do not cross from Windows into the container, so watch by polling.
      CHOKIDAR_USEPOLLING: "true"
      # The Careers page reads the portal API. Locally that is the portal stack (nandivex-platform docker) on :4010;
      # remove this line to read the live https://api.nandivex.in instead.
      VITE_CAREERS_API: "http://localhost:4010"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - website_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund --no-package-lock && npm run dev -- --host 0.0.0.0 --port 5173"

  web:
    profiles: ["prod"]
    build: .
    image: nandivex-website:local
    container_name: nandivex-website
    ports:
      - "8081:80"

volumes:
  website_node_modules:
